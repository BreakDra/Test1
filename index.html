<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>.error{color:#b00020}.hidden{display:none}</style>
</head>
<body>
  <main class="center">
    <form class="card" method="post" action="/login" id="loginForm">
      <h2 class="title">Đăng nhập</h2>
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" type="text" required>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">Đăng nhập</button>
      <p class="error hidden" id="errorMsg"></p>
      <p class="muted">Chưa có tài khoản? <a href="/register.html">Đăng ký</a></p>
    </form>
  </main>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const err = params.get('error');
      if (err) {
        try {
          const msg = decodeURIComponent(err);
          const el = document.getElementById('errorMsg');
          el.textContent = msg;
          el.classList.remove('hidden');
        } catch (e) { console.error(e); }
        const url = new URL(window.location);
        url.search = '';
        history.replaceState(null, '', url.toString());
      }
    })();
  </script>
</body>
</html>
